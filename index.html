<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Тёмный Квест</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;background:#0a0e1a;color:#e8eaf6;-webkit-user-select:none;user-select:none}
#app{display:flex;flex-direction:column;height:100vh;height:-webkit-fill-available}
#topbar{padding:10px 14px;display:flex;justify-content:space-between;align-items:center;background:#111830;border-bottom:1px solid #1e2a4a;flex-shrink:0}
.stat{font-weight:700;font-size:16px}
#zone{color:#9fb0e8;font-size:13px}
#hpwrap{height:8px;background:#1a2342;border-radius:4px;margin:0 14px;flex-shrink:0}
#hpbar{height:100%;background:#4caf50;border-radius:4px;width:100%;transition:width .15s}
#content{flex:1 1 0;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 12px calc(16px + env(safe-area-inset-bottom))}
#nav{display:flex;background:#111830;border-top:1px solid #1e2a4a;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
.navbtn{flex:1;text-align:center;padding:8px 0 6px;color:#7a86b8;font-size:11px;cursor:pointer}
.navbtn .ic{font-size:20px;display:block}
.navbtn.active{color:#ffd166}
.card{background:#141c38;border:1px solid #26325c;border-radius:14px;padding:14px;margin-bottom:12px}
.card.glow{border-color:#ffd166}
h2{font-size:20px;margin:4px 0 12px}
.btn{background:#4353b0;color:#fff;border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-top:8px}
.btn:active{transform:scale(.97)}
.btn.small{width:auto;padding:8px 14px;font-size:13px;margin-top:6px}
.btn.ghost{background:transparent;border:1px solid #4353b0}
.btn:disabled{opacity:.5}
input{width:100%;background:#1a2342;border:1px solid #2c3a6e;border-radius:12px;padding:12px;color:#fff;font-size:16px;-webkit-user-select:text;user-select:text}
.muted{color:#8a94c4;font-size:13px;line-height:1.4}
.lrow{display:flex;justify-content:space-between;padding:10px 14px;border:1px solid #2c3a6e;border-radius:12px;margin-bottom:8px;background:#141c38}
.lrow.me{border-color:#ffd166}
.enemy{text-align:center;padding:20px 0 10px;position:relative}
.eicon{font-size:72px;display:block;cursor:pointer;line-height:1}
.ehp{font-size:14px;color:#8a94c4;margin-top:8px}
.eboss{color:#ff6b6b;font-weight:700}
.float{position:absolute;font-weight:800;pointer-events:none;animation:fl .8s ease-out forwards;z-index:5}
@keyframes fl{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-50px)}}
.chest{position:absolute;font-size:36px;cursor:pointer;animation:pulse 1s infinite;z-index:6}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#26325c;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99;max-width:90%;text-align:center}
#errbar{position:fixed;top:0;left:0;right:0;background:#c0392b;color:#fff;padding:8px 12px;font-size:12px;z-index:100;display:none}
.slotrow{display:flex;align-items:center;justify-content:space-between;padding:10px;border:1px solid #2c3a6e;border-radius:12px;margin-bottom:8px;background:#141c38}
progress{width:100%;height:6px}
</style>
</head>
<body>
<div id="errbar"></div>
<div id="app">
  <div id="topbar">
    <span class="stat">🪙 <span id="sgold">0</span></span>
    <span class="stat">💎 <span id="scr">0</span></span>
    <span id="zone"></span>
  </div>
  <div id="hpwrap"><div id="hpbar"></div></div>
  <div id="content"></div>
  <div id="nav">
    <div class="navbtn active" data-t="fight"><span class="ic">⚔️</span>Бой</div>
    <div class="navbtn" data-t="up"><span class="ic">⚡</span>Апгрейды</div>
    <div class="navbtn" data-t="bag"><span class="ic">🎒</span>Сумка</div>
    <div class="navbtn" data-t="rec"><span class="ic">🏅</span>Рекорды</div>
    <div class="navbtn" data-t="lb"><span class="ic">🏆</span>Рейтинг</div>
  </div>
</div>
<div id="toast"></div>
<script>
window.onerror=function(m,s,l){var e=document.getElementById("errbar");e.style.display="block";e.textContent="Ошибка (строка "+l+"): "+m;};

// НАСТРОЙКА ОНЛАЙН-РЕЙТИНГА (Supabase)
var SUPABASE_URL="https://fblnukkcvglfsnyiyiwv.supabase.co";
var SUPABASE_KEY="sb_publishable_f2xL88D11mm82b0QHFg6eQ_xN0VBTkG";

var tg=null;try{if(window.Telegram&&window.Telegram.WebApp){tg=window.Telegram.WebApp;tg.expand();if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();}}catch(e){}
function buzz(){try{if(tg&&tg.HapticFeedback)tg.HapticFeedback.impactOccurred("light");}catch(e){}}

var ZONES=[["Волшебный лес","🌲"],["Мрачные пещеры","🕳️"],["Огненные пещеры","🌋"],["Ледяные пустоши","❄️"],["Небесная цитадель","☁️"],["Бездна","😈"]];
var RAR=[["Обычный","#9aa5c0"],["Редкий","#4da3ff"],["Эпический","#b06bff"],["Легендарный","#ffb02e"]];
var RARM=[1,1.6,2.5,4];
var SLOTS={weapon:["⚔️","Оружие",["Ржавый клинок","Стальной клинок","Клинок бури","Клык дракона"]],
armor:["🛡️","Броня",["Тряпичная роба","Кольчуга","Латный доспех","Щит титана"]],
amulet:["📿","Амулет",["Костяной амулет","Серебряный оберег","Рунный талисман","Око дракона"]],
ring:["💍","Кольцо",["Медное кольцо","Серебряное кольцо","Кольцо чародея","Перстень власти"]]};
var UPS=[["sword","⚔️ Меч","Урон за тап: +3 урона",10],["companion","🐾 Спутник","Урон в секунду: +1.5",25],["acc","🎯 Меткость","Шанс крита: +1.5%",30],["rage","💥 Ярость","Сила крита: +0.5x",30],["greed","💰 Жадность","Золото: +10%",40]];
var KEY="dq_save_v8";

function def(){return{gold:0,crystals:0,stage:1,ehp:0,emax:0,sword:0,companion:0,acc:0,rage:0,greed:0,rebirths:0,runMax:1,inv:[],slots:{weapon:null,armor:null,amulet:null,ring:null},lastDaily:"",streak:0,records:[],lbname:""};}
function num(v,d){v=Number(v);return isFinite(v)&&v>=0?v:d;}
function load(){var s=def();try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);for(var k in s){if(k==="inv"){if(Array.isArray(o.inv))s.inv=o.inv.filter(function(it){return it&&SLOTS[it.slot];});}else if(k==="slots"){for(var sl in s.slots){var it=o.slots&&o.slots[sl];if(it&&SLOTS[it.slot])s.slots[sl]=it;}}else if(k==="records"){if(Array.isArray(o.records))s.records=o.records.filter(function(r){return r&&num(r.s,0)>0;}).slice(0,10);}else if(typeof s[k]==="number"){s[k]=num(o[k],s[k]);}else if(o[k]!==undefined){s[k]=o[k];}}}}catch(e){}
s.stage=Math.min(1000000,Math.max(1,Math.floor(s.stage)));
s.emax=maxHp(s.stage);if(!s.ehp||s.ehp<=0||s.ehp>s.emax)s.ehp=s.emax;
s.runMax=Math.max(s.runMax,s.stage);
return s;}
var S=load();

function rmult(){return 1+0.05*S.crystals;}
function bonus(sl){return S.slots[sl]?S.slots[sl].p:0;}
function tapDmg(){return Math.ceil((1+S.sword*3)*rmult()*(1+bonus("weapon")));}
function dps(){return (0.5+S.companion*1.5)*rmult()*(1+bonus("armor"));}
function critCh(){return Math.min(0.6,0.05+S.acc*0.015+bonus("amulet")*0.003);}
function critM(){return 2+S.rage*0.5;}
function goldKill(){return Math.ceil((5+S.stage*2)*(1+S.greed*0.1)*rmult()*(1+bonus("ring")*0.005));}
function isBoss(){return S.stage%10===0;}
function maxHp(st){return Math.floor(12*Math.pow(st,1.4)*(st%10===0?6:1));}
function zone(){return ZONES[Math.min(5,Math.floor((S.stage-1)/10))];}
function fmt(n){n=Math.floor(n);if(n>=1e9)return (n/1e9).toFixed(1)+"B";if(n>=1e6)return (n/1e6).toFixed(1)+"M";if(n>=1e4)return (n/1e3).toFixed(1)+"K";return String(n);}
function cost(u){return Math.floor(u[3]*Math.pow(1.5,S[u[0]]));}

var tab="fight",chest=null,nextChest=Date.now()+45000+Math.random()*45000;

function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(function(){t.style.opacity=0;},2600);}
function h(){return{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"};}
function bestStage(){var m=S.runMax;for(var i=0;i<S.records.length;i++)if(S.records[i].s>m)m=S.records[i].s;return m;}

function float(txt,crit){var a=document.getElementById("efield");if(!a)return;var el=document.createElement("span");el.className="float";el.textContent=txt;el.style.color=crit?"#ffd166":"#fff";el.style.left=(30+Math.random()*40)+"%";el.style.top=(35+Math.random()*25)+"%";el.style.fontSize=crit?"24px":"18px";a.appendChild(el);setTimeout(function(){el.remove();},800);}

function hurt(d,crit){if(S.ehp<=0)return;S.ehp-=d;float((crit?"КРИТ ","")+"-"+fmt(d),crit);buzz();if(S.ehp<=0)kill();}
function tap(e){if(S.ehp<=0)return;var crit=Math.random()<critCh();var d=tapDmg()*(crit?critM():1);hurt(Math.ceil(d),crit);}
function kill(){var g=goldKill();S.gold+=g;float("+"+fmt(g)+" 🪙");drop(false);S.stage=Math.min(1000000,S.stage+1);if(S.stage>S.runMax)S.runMax=S.stage;S.emax=maxHp(S.stage);S.ehp=S.emax;save();render();}
function drop(force){if(!force&&Math.random()>0.08)return;var r=Math.random();var rar=r<0.6?0:(r<0.85?1:(r<0.97?2:3));if(force&&rar<1)rar=1;var sl=["weapon","armor","amulet","ring"][Math.floor(Math.random()*4)];var p=Math.max(1,Math.round(S.stage*RARM[rar]*(0.8+Math.random()*0.4)));var it={slot:sl,r:rar,p:p,n:SLOTS[sl][2][rar]};S.inv.push(it);autoEquip();toast("🎒 Выпало: "+it.n+" ("+RAR[rar][0]+")");}
function autoEquip(){for(var sl in S.slots){var best=S.slots[sl];for(var i=0;i<S.inv.length;i++){var it=S.inv[i];if(it.slot===sl&&(!best||it.p>best.p))best=it;}S.slots[sl]=best;}}
function sellJunk(){var got=0;for(var sl in S.slots){var b=S.slots[sl]?S.slots[sl].p:0;S.inv=S.inv.filter(function(it){if(it.slot!==sl)return true;if(it.p<b){got+=it.p*2;return false;}return true;});}S.gold+=got;toast(got?("Продано на "+fmt(got)+" 🪙"):"Лишнего ничего нет");save();render();}

function rebirth(){if(S.stage<10)return;var gain=Math.floor(S.stage/5);S.records.push({d:Date.now(),s:S.runMax});S.records.sort(function(a,b){return b.s-a.s;});S.records=S.records.slice(0,10);S.crystals+=gain;S.rebirths++;S.gold=0;S.stage=1;S.runMax=1;S.sword=0;S.companion=0;S.acc=0;S.rage=0;S.greed=0;S.inv=[];S.slots={weapon:null,armor:null,amulet:null,ring:null};S.emax=maxHp(1);S.ehp=S.emax;toast("🌀 Перерождение! +"+gain+" 💎");save();render();}

function daily(){var t=new Date();var today=t.getFullYear()+"-"+(t.getMonth()+1)+"-"+t.getDate();if(S.lastDaily===today)return;var y=new Date(t);y.setDate(y.getDate()-1);var ys=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();S.streak=(S.lastDaily===ys)?S.streak+1:1;S.lastDaily=today;var c=Math.min(S.streak,7);S.crystals+=c;S.gold+=Math.ceil(30*S.stage*rmult());setTimeout(function(){toast("🎁 Подарок за день "+S.streak+": +"+c+" 💎");},600);}

function grabChest(){if(!chest)return;var r=Math.random();if(r<0.5){var g=goldKill()*20;S.gold+=g;toast("🎁 Сундук: +"+fmt(g)+" 🪙");}else if(r<0.8){var c=1+Math.floor(Math.random()*3);S.crystals+=c;toast("🎁 Сундук: +"+c+" 💎");}else{drop(true);toast("🎁 В сундуке был предмет!");}chest=null;nextChest=Date.now()+45000+Math.random()*45000;render();}

function renderTop(){document.getElementById("sgold").textContent=fmt(S.gold);document.getElementById("scr").textContent=fmt(S.crystals);document.getElementById("zone").textContent=zone()[0]+" "+zone()[1];var p=S.emax>0?Math.max(0,S.ehp/S.emax*100):0;document.getElementById("hpbar").style.width=p+"%";}
function render(){renderTop();var c=document.getElementById("content");
if(tab==="fight")c.innerHTML=fightHtml();
else if(tab==="up")c.innerHTML=upHtml();
else if(tab==="bag")c.innerHTML=bagHtml();
else if(tab==="rec")c.innerHTML=recHtml();
else if(tab==="lb"){c.innerHTML=lbHtml();refreshLb();}
}

function fightHtml(){var z=zone();var e=isBoss()?"👑":"🧟";var chestHtml="";if(chest)chestHtml='<div class="chest" style="left:'+chest.x+'%;top:'+chest.y+'%" data-act="chest">🎁</div>';
return '<h2>'+z[0]+' '+z[1]+' — этап '+S.stage+(isBoss()?' <span class="eboss">БОСС!</span>':'')+'</h2>'+
'<div class="card" style="position:relative" id="efield">'+chestHtml+
'<span class="eicon" data-act="tap">'+e+'</span>'+
'<div class="ehp">'+(isBoss()?'БОСС: ':'Враг: ')+fmt(S.ehp)+' / '+fmt(S.emax)+' HP</div>'+
'<div class="muted" style="margin-top:6px">Урон за тап: '+fmt(tapDmg())+' · Спутник: '+fmt(dps())+'/с · Крит: '+Math.round(critCh()*100)+'% x'+critM().toFixed(1)+'</div></div>'+
'<div class="card"><div class="muted">Тапайте по врагу! За быстрый тап идёт комбо. Сундуки появляются на этом экране — успевайте за 12 секунд.</div>'+
(S.stage>=10?'<button class="btn" data-act="rebirth">🌀 Перерождение (+'+Math.floor(S.stage/5)+' 💎, сброс прогресса)</button>':'<div class="muted" style="margin-top:8px">🌀 Перерождение откроется на этапе 10</div>')+'</div>';}

function upHtml(){var out='<h2>⚡ Апгрейды</h2>';for(var i=0;i<UPS.length;i++){var u=UPS[i],c=cost(u);out+='<div class="card"><div>'+u[1]+' <span style="color:#ffd166">ур. '+S[u[0]]+'</span></div><div class="muted">'+u[2]+'</div><button class="btn small" data-act="buy" data-i="'+i+'"'+(S.gold<c?" disabled":"")+'>Купить · 🪙 '+fmt(c)+'</button></div>';}
out+='<div class="card"><div class="muted">💎 Кристаллов: '+S.crystals+' (каждый даёт +5% к урону и золоту навсегда). Перерождений: '+S.rebirths+'</div></div>';return out;}

function bagHtml(){var out='<h2>🎒 Сумка</h2>';for(var sl in S.slots){var it=S.slots[sl];var meta=SLOTS[sl];out+='<div class="slotrow"><span>'+meta[0]+' '+meta[1]+': '+(it?'<b style="color:'+RAR[it.r][1]+'">'+it.n+'</b> (+'+(sl==="amulet"?(it.p*0.3).toFixed(1)+"% крита":sl==="ring"?(it.p*0.5).toFixed(1)+"% золота":sl==="weapon"?"+"+it.p+" к урону":"+"+it.p+" к спутнику")+")":'<span class="muted">пусто</span>')+'</span></div>';}
out+='<div class="card"><b>Инвентарь: '+S.inv.length+' предметов</b>';
if(S.inv.length){out+='<div style="margin-top:8px">';for(var i=0;i<S.inv.length;i++){var q=S.inv[i];out+='<div class="muted" style="margin:4px 0;color:'+RAR[q.r][1]+'">'+SLOTS[q.slot][0]+' '+q.n+' ('+RAR[q.r][0]+', сила '+q.p+')</div>';}out+='</div>';}
out+='<button class="btn ghost" data-act="sell">🗑️ Продать лишнее (слабые дубликаты)</button></div>';return out;}

function recHtml(){var out='<h2>🏅 Рекорды забегов</h2>';if(!S.records.length)return out+'<div class="card"><div class="muted">Пока пусто — сделайте первое перерождение, и забег попадёт в таблицу.</div></div>';var md=["🥇","🥈","🥉"];for(var i=0;i<S.records.length;i++){var r=S.records[i];var d=new Date(r.d);out+='<div class="lrow"><span>'+(i<3?md[i]:(i+1))+' '+S.lbname+'</span><span>эп. '+r.s+' · '+d.toLocaleDateString()+'</span></div>';}return out;}

function lbHtml(){return '<h2>🏆 Онлайн-рейтинг</h2><div class="card"><div class="muted">Имя в рейтинге:</div><input id="lbname" value="'+(S.lbname||"")+'" maxlength="16" placeholder="Ваше имя"><button class="btn" data-act="send">📤 Отправить результат</button><button class="btn ghost" data-act="refresh">🔄 Обновить таблицу</button><div id="lbmsg" class="muted" style="margin-top:10px"></div></div><div id="lblist"></div>';}

function lbmsg(m){var el=document.getElementById("lbmsg");if(el)el.textContent=m;}
async function refreshLb(){var list=document.getElementById("lblist");if(!list)return;
try{var r=await fetch(SUPABASE_URL+"/rest/v1/leaderboard?select=*&order=stage.desc,created_at.asc&limit=10",{headers:h()});var arr=await r.json();
if(!r.ok){var msg=(arr&&arr.message)?arr.message:("HTTP "+r.status);if(String(msg).indexOf("does not exist")>=0)msg='Таблица не создана — выполните SQL создания таблицы в Supabase';list.innerHTML='<div class="card"><div class="muted">⚠️ '+msg+'</div></div>';return;}
if(!arr.length){list.innerHTML='<div class="card"><div class="muted">Пока пусто — станьте первым!</div></div>';return;}
var md=["🥇","🥈","🥉"],out="";for(var i=0;i<arr.length;i++){var row=arr[i];var me=S.lbname&&row.name===S.lbname;out+='<div class="lrow'+(me?" me":"")+'"><span>'+(i<3?md[i]:(i+1))+' '+row.name.replace(/</g,"&lt;")+'</span><span>эп. '+row.stage+' · 💎 '+row.crystals+'</span></div>';}
list.innerHTML=out;}catch(e){list.innerHTML='<div class="card"><div class="muted">⚠️ Нет связи с сервером: '+e.message+'</div></div>';}}
async function sendScore(){var inp=document.getElementById("lbname");var name=inp?inp.value.trim():"";if(!name){lbmsg("Введите имя");return;}S.lbname=name;save();
try{var r=await fetch(SUPABASE_URL+"/rest/v1/leaderboard?select=id,stage&name=eq."+encodeURIComponent(name)+"&limit=1",{headers:h()});var arr=await r.json();if(!r.ok)throw new Error("HTTP "+r.status);
var st=bestStage();
if(arr.length){if(st>arr[0].stage){var u=await fetch(SUPABASE_URL+"/rest/v1/leaderboard?id=eq."+arr[0].id,{method:"PATCH",headers:h(),body:JSON.stringify({stage:st,crystals:S.crystals})});if(!u.ok)throw new Error("HTTP "+u.status+" (проверьте политику update в RLS)");lbmsg("Обновлено: эп. "+st);}else lbmsg("В таблице уже есть результат не хуже — лучший сохраняется");}
else{var p=await fetch(SUPABASE_URL+"/rest/v1/leaderboard",{method:"POST",headers:h(),body:JSON.stringify({name:name,stage:st,crystals:S.crystals})});if(!p.ok)throw new Error("HTTP "+p.status+" (проверьте политику insert в RLS)");lbmsg("Результат отправлен!");}
refreshLb();}catch(e){lbmsg("Ошибка: "+e.message);}}

document.getElementById("nav").addEventListener("click",function(e){var b=e.target.closest(".navbtn");if(!b)return;tab=b.dataset.t;document.querySelectorAll(".navbtn").forEach(function(x){x.classList.toggle("active",x===b);});render();});
document.getElementById("content").addEventListener("click",function(e){var a=e.target.closest("[data-act]");if(!a)return;var act=a.dataset.act;
if(act==="tap")tap(e);
else if(act==="chest")grabChest();
else if(act==="buy"){var u=UPS[+a.dataset.i],c=cost(u);if(S.gold>=c){S.gold-=c;S[u[0]]++;save();render();}}
else if(act==="rebirth")rebirth();
else if(act==="sell")sellJunk();
else if(act==="send")sendScore();
else if(act==="refresh")refreshLb();});

setInterval(function(){if(dps()>0&&S.ehp>0)hurt(dps()*0.6,false);
if(chest&&Date.now()>chest.until){chest=null;nextChest=Date.now()+45000+Math.random()*45000;render();}
