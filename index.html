<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Тёмный Квест</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
@supports (-webkit-touch-callout:none){html{height:-webkit-fill-available}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(180deg,#0b0e1a,#141830);color:#e8e6f0;min-height:100dvh;padding-bottom:76px;overscroll-behavior:none}
#err{position:fixed;top:0;left:0;right:0;background:#c0392b;color:#fff;padding:8px 12px;font-size:12px;z-index:99;display:none;word-break:break-word}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#232a4d;border:1px solid #4a55a2;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:98;display:none;max-width:90vw;text-align:center}
header{position:sticky;top:0;background:rgba(11,14,26,.92);backdrop-filter:blur(6px);padding:10px 12px 8px;z-index:10}
.row{display:flex;justify-content:space-between;font-size:14px;gap:8px;flex-wrap:wrap}
.row b{color:#ffd75e}
#hZone{color:#9fb4ff;font-size:13px}
.bar{height:8px;border-radius:6px;background:#20263f;margin-top:8px;overflow:hidden}
.bar>div{height:100%;border-radius:6px;transition:width .15s}
#ebarFill{background:linear-gradient(90deg,#39d353,#8ff06a);width:100%}
#hpFill{background:linear-gradient(90deg,#ff5252,#ff8a65);width:100%}
main{padding:12px}
.tab.hidden{display:none}
.hidden{display:none!important}
.enemy-wrap{position:relative;text-align:center;margin-top:8px}
.boss{color:#ffb020;font-weight:700;letter-spacing:2px;font-size:14px;margin-bottom:6px}
#enemy{display:inline-flex;align-items:center;justify-content:center;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#2a3060,#171b36);border:3px solid #4a55a2;font-size:70px;user-select:none;cursor:pointer;transition:transform .08s;touch-action:manipulation}
#enemy:active{transform:scale(.93)}
.stage{text-align:center;margin-top:10px;color:#9fb4ff;font-size:15px}
.hplbl{text-align:center;font-size:13px;color:#c9cbe0;margin-top:4px}
#floats{position:fixed;inset:0;pointer-events:none;z-index:50}
.fl{position:absolute;font-weight:700;pointer-events:none;animation:flup .9s ease-out forwards;text-shadow:0 2px 6px #000}
.fl.crit{color:#ffb020;font-size:20px}
.fl.norm{color:#fff;font-size:16px}
.fl.gold{color:#ffd75e;font-size:15px}
@keyframes flup{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-70px)}}
#chest{position:absolute;width:56px;height:56px;font-size:36px;display:flex;align-items:center;justify-content:center;background:rgba(255,176,32,.15);border:2px solid #ffb020;border-radius:14px;cursor:pointer;z-index:5;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
button{font-family:inherit}
.gift{display:block;width:100%;margin-top:14px;padding:12px;border-radius:12px;border:0;background:linear-gradient(90deg,#7b3ff2,#b45cff);color:#fff;font-size:15px;font-weight:700}
.prest{display:block;width:100%;margin-top:12px;padding:12px;border-radius:12px;border:1px solid #4a55a2;background:transparent;color:#9fb4ff;font-size:14px}
.prest:disabled{opacity:.4}
h2{font-size:18px;margin:4px 0 12px}
.upg{display:flex;align-items:center;gap:10px;background:#171b36;border:1px solid #2a3060;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.upg .ic{font-size:24px}
.upg .info{flex:1;min-width:0}
.upg .nm{font-weight:600;font-size:14px}
.upg .eff{font-size:12px;color:#9fb4ff}
.upg .lv{font-size:12px;color:#9aa4b2}
.buy{padding:8px 12px;border-radius:10px;border:0;background:#ffd75e;color:#1a1500;font-weight:700;font-size:13px;white-space:nowrap}
.buy:disabled{background:#3a4066;color:#8890b8}
.slotgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.slot{background:#171b36;border:1px solid #2a3060;border-radius:12px;padding:10px;font-size:12px;min-height:64px}
.slot .t{color:#9aa4b2;font-size:11px}
.slot .v{color:#9fb4ff}
.inv{display:flex;align-items:center;gap:8px;background:#171b36;border:1px solid #2a3060;border-radius:12px;padding:8px 10px;margin-bottom:6px;font-size:13px}
.inv .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv .eq{color:#39d353;font-size:12px}
.sell{padding:6px 10px;border-radius:8px;border:0;background:#3a4066;color:#c9cbe0;font-size:12px}
.rec{display:flex;align-items:center;gap:10px;background:#171b36;border:1px solid #2a3060;border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:14px}
.rec .med{width:26px;text-align:center;font-size:18px}
.lbname{margin-bottom:10px;font-size:14px}
.lbname input{background:#171b36;border:1px solid #2a3060;color:#e8e6f0;border-radius:10px;padding:8px 10px;font-size:14px;width:150px}
.btn{display:block;width:100%;padding:11px;border-radius:12px;border:0;background:#4a55a2;color:#fff;font-size:14px;font-weight:600;margin-bottom:8px}
.btn.ghost{background:transparent;border:1px solid #4a55a2;color:#9fb4ff}
.lbr{display:flex;align-items:center;gap:10px;background:#171b36;border:1px solid #2a3060;border-radius:12px;padding:9px 12px;margin-bottom:6px;font-size:13px}
.lbr.me{border-color:#ffd75e;background:#221f33}
.lbr .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.muted{color:#8890b8;font-size:13px;padding:8px 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(15,18,35,.97);border-top:1px solid #2a3060;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;border:0;color:#8890b8;font-size:20px;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:10px}
nav button.on{color:#ffd75e}
</style>
</head>
<body>
<div id="err"></div>
<div id="toast"></div>
<header>
  <div class="row"><span>🪙 <b id="hGold">0</b></span><span>💎 <b id="hCr">0</b></span><span id="hZone"></span></div>
  <div class="bar"><div id="ebarFill"></div></div>
</header>
<main>
  <section id="tab-battle" class="tab">
    <div class="enemy-wrap">
      <div id="bossBadge" class="boss hidden">👑 БОСС</div>
      <div id="enemy">🌲</div>
      <div id="chest" class="hidden">🎁</div>
    </div>
    <div class="stage" id="stageLbl"></div>
    <div class="bar"><div id="hpFill"></div></div>
    <div class="hplbl" id="hpLbl"></div>
    <button id="giftBtn" class="gift hidden"></button>
    <button id="prestBtn" class="prest"></button>
  </section>
  <section id="tab-upg" class="tab hidden"><h2>⚡ Улучшения</h2><div id="upgList"></div></section>
  <section id="tab-inv" class="tab hidden"><h2>🎒 Снаряжение</h2><div id="slotGrid"></div><div id="invList"></div></section>
  <section id="tab-rec" class="tab hidden"><h2>🎖️ Мои рекорды</h2><div id="recList"></div></section>
  <section id="tab-lb" class="tab hidden"><h2>🏆 Онлайн-рейтинг</h2>
    <div class="lbname">Имя в рейтинге: <input id="lbName" maxlength="16" placeholder="Игрок"></div>
    <button id="lbSend" class="btn">📤 Отправить результат</button>
    <button id="lbRef" class="btn ghost">🔄 Обновить таблицу</button>
    <div id="lbList"></div>
  </section>
</main>
<nav>
  <button data-tab="battle" class="on">⚔️<span>Бой</span></button>
  <button data-tab="upg">⚡<span>Апгрейды</span></button>
  <button data-tab="inv">🎒<span>Сумка</span></button>
  <button data-tab="rec">🎖️<span>Рекорды</span></button>
  <button data-tab="lb">🏆<span>Рейтинг</span></button>
</nav>
<div id="floats"></div>
<script>
"use strict";
// ===== НАСТРОЙКА ОНЛАЙН-РЕЙТИНГА (Supabase) =====
const SUPABASE_URL = "https://fblnukkcvglfsnyiyiwv.supabase.co";
const SUPABASE_KEY = "sb_publishable_f2xL88D11mm82b0QHFg6eQ_xN0VBTkG";
// ================================================

const $=id=>document.getElementById(id);
window.addEventListener('error',e=>{const b=$('err');b.style.display='block';b.textContent='Ошибка: '+e.message+(e.lineno?' (строка '+e.lineno+')':'');});

const tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
if(tg){try{tg.ready();tg.expand();}catch(e){}}
function haptic(){if(tg&&tg.HapticFeedback){try{tg.HapticFeedback.impactOccurred('light');}catch(e){}}}

const ZONES=[["Волшебный лес","🌲"],["Мрачные пещеры","🕳️"],["Огненные пещеры","🔥"],["Ледяные пустоши","❄️"],["Небесная цитадель","☁️"],["Бездна","🌌"]];
const EMO=[["🌲","🌳","🐗","🧚","🦊"],["🦇","🕷️","🦎","👹","🪨"],["🔥","🐲","👹","🧟","🌋"],["❄️","🐻","🧙","🦌","⛄"],["☁️","🦅","⚡","🗿","👑"],["🌌","👾","🛸","💀","🌑"]];
const RAR=[["Обычный","#9aa4b2",1],["Редкий","#4da3ff",2],["Эпический","#b45cff",4],["Легендарный","#ffb020",9]];
const SLOTS=[["weapon","⚔️","Оружие","урон за тап"],["armor","🛡️","Броня","сила спутника"],["amulet","📿","Амулет","шанс крита"],["ring","💍","Кольцо","золото"]];
const NAMES={weapon:["Ржавый клинок","Кинжал","Стальной клинок","Меч","Топор войны","Клык дракона"],armor:["Тряпка","Кожаный доспех","Кольчуга","Латы","Панцирь","Эгида"],amulet:["Бубенец","Оберег","Амулет","Талисман","Реликвия","Сердце звёзды"],ring:["Кольцо","Печатка","Перстень","Знак власти","Печать","Кольцо бесконечности"]};
const UPG=[
 ["finger","💪","Сильный палец",10,1.5,"+1 урона за тап"],
 ["comp","🤝","Клик-бот",25,1.6,"+0.5 урона в секунду"],
 ["crit","🎯","Меткость",50,1.7,"+1% шанс крита"],
 ["critPow","💥","Ярость",80,1.8,"+25% к силе крита"],
 ["greed","💰","Жадность",40,1.65,"+20% золота"],
 ["batt","🔋","Батарейка",30,1.7,"+10 энергии, +0.2/сек"]
];

const DEFAULT={gold:0,crystals:0,stage:1,kills:0,best:1,upg:{finger:0,comp:0,crit:0,critPow:0,greed:0,batt:0},energy:50,lastSeen:0,daily:{last:"",streak:0},inv:[],rec:[],name:"",lastSubStage:0,lastSubTime:0,hp:-1};

function cl(v,d,max){v=Number(v);return(isFinite(v)&&v>=0)?Math.min(v,max||1e18):d;}
function load(){
 let s=null;try{s=JSON.parse(localStorage.getItem('dq_save')||"null");}catch(e){}
 const d=JSON.parse(JSON.stringify(DEFAULT));
 if(!s||typeof s!=="object")return d;
 d.gold=cl(s.gold,0);d.crystals=cl(s.crystals,0,1e12);d.stage=Math.min(Math.max(1,Math.floor(cl(s.stage,1))),1e6);
 d.kills=Math.floor(cl(s.kills,0));d.best=Math.min(Math.max(1,Math.floor(cl(s.best,d.stage))),1e6);
 if(s.upg&&typeof s.upg==="object"){for(const u of UPG){d.upg[u[0]]=Math.floor(cl(s.upg[u[0]],0,1e6));}}
 d.energy=cl(s.energy,50);
 d.lastSeen=cl(s.lastSeen,0);
 if(s.daily&&typeof s.daily==="object"){d.daily.last=typeof s.daily.last==="string"?s.daily.last:"";d.daily.streak=Math.floor(cl(s.daily.streak,0,1e5));}
 if(Array.isArray(s.inv)){for(const it of s.inv.slice(0,40)){if(it&&it.slot&&NAMES[it.slot]&&typeof it.p==="number"&&isFinite(it.p)&&it.rar>=0&&it.rar<4)d.inv.push({slot:it.slot,rar:it.rar|0,p:Math.max(1,it.p),name:String(it.name).slice(0,40)});}}
 if(Array.isArray(s.rec)){for(const r of s.rec.slice(0,10)){if(r)d.rec.push({s:Math.floor(cl(r.s,1)),t:Math.floor(cl(r.t,0))});}}
 d.name=typeof s.name==="string"?s.name.slice(0,16):"";
 d.lastSubStage=Math.floor(cl(s.lastSubStage,0));d.lastSubTime=cl(s.lastSubTime,0);
 d.hp=cl(s.hp,-1);
 return d;
}
let S=load();
function save(){try{S.lastSeen=Date.now();localStorage.setItem('dq_save',JSON.stringify(S));}catch(e){}}
let saveT=null;function saveSoon(){if(saveT)return;saveT=setTimeout(()=>{saveT=null;save();},800);}

function itemBonus(slot){let p=0;for(const it of S.inv)if(it.slot===slot&&it.p>p)p=it.p;return p;}
function prestMult(){return 1+S.crystals*0.05;}
function clickDmg(){return (1+S.upg.finger)*prestMult()*(1+itemBonus('weapon')/100);}
function compDps(){return S.upg.comp*0.5*prestMult()*(1+itemBonus('armor')/100);}
function critChance(){return Math.min(75,S.upg.crit+itemBonus('amulet')/20);}
function critMult(){return 2+S.upg.critPow*0.25;}
function goldMult(){return (1+S.upg.greed*0.2)*prestMult()*(1+itemBonus('ring')/100);}
function energyMax(){return 50+S.upg.batt*10;}
function upgCost(i){return Math.floor(UPG[i][3]*Math.pow(UPG[i][4],S.upg[UPG[i][0]]));}
function isBoss(){return S.stage%10===0;}
function enemyHpMax(){return Math.min(1e18,Math.floor(10*Math.pow(1.17,S.stage-1))*(isBoss()?6:1));}
function goldForKill(){return Math.max(1,Math.floor((3+S.stage*1.2)*goldMult()*(isBoss()?10:1)));}
function crystalsFor(){return S.stage>=20?Math.floor(Math.pow(S.stage,0.7)):0;}
function fmt(n){n=Math.floor(n);if(n<1000)return String(n);if(n<1e6)return (n/1e3).toFixed(1).replace(/\.0$/,'')+'K';if(n<1e9)return (n/1e6).toFixed(2)+'M';return (n/1e9).toFixed(2)+'B';}

let toastT=null;
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display='none';},2600);}

function floatNum(e,text,cls){
 const d=document.createElement('div');d.className='fl '+cls;d.textContent=text;
 let x=innerWidth/2,y=innerHeight/2-80;
 if(e&&e.clientX!==undefined){x=e.clientX;y=e.clientY-20;}
 x=Math.max(30,Math.min(innerWidth-30,x));y=Math.max(60,y);
 d.style.left=x+'px';d.style.top=y+'px';
 $('floats').appendChild(d);setTimeout(()=>d.remove(),900);
}

function genItem(bonusRar){
 let r=Math.random();if(bonusRar)r=r*0.6;
 const rar=r<0.5?0:r<0.82?1:r<0.96?2:3;
 const power=Math.max(1,Math.round((5+S.stage*0.8)*RAR[rar][2]*(0.8+Math.random()*0.4)));
 const slot=SLOTS[Math.floor(Math.random()*4)][0];
 const tier=Math.min(5,Math.floor(power/25));
 return{slot:slot,rar:rar,p:power,name:RAR[rar][0]+' '+NAMES[slot][tier]};
}
function addItem(it){
 S.inv.push(it);
 while(S.inv.length>20){
  let best={};for(const x of S.inv)if(!best[x.slot]||x.p>best[x.slot].p)best[x.slot]=x.p;
  let wi=-1,wp=1e18;
  for(let i=0;i<S.inv.length;i++){const x=S.inv[i];if(x.p<best[x.slot]&&x.p<wp){wp=x.p;wi=i;}}
  if(wi<0)break;
  S.gold+=Math.floor(S.inv[wi].p*20);S.inv.splice(wi,1);
 }
}

let newEnemyFlag=false;
function newEnemy(){S.hp=enemyHpMax();newEnemyFlag=true;}
function kill(){
 if(S.hp>0)return;
 const g=goldForKill();S.gold=Math.min(1e18,S.gold+g);S.kills++;
 floatNum(null,'+'+fmt(g)+' 🪙','gold');
 if(S.stage<1e6)S.stage++;
 if(S.stage>S.best)S.best=S.stage;
 const ch=Math.random()<(isBoss()?1:0.08);
 if(ch){const it=genItem(false);addItem(it);toast('🎁 Выпал: '+it.name);renderInv();}
 newEnemy();saveSoon();maybeSubmit(false);
}

let lastTap=0;
function tap(e){
 if(S.hp<=0)return;
 const now=Date.now();if(now-lastTap<40)return;lastTap=now;
 if(S.energy<1){toast('⚡ Нет энергии — подождите');return;}
 S.energy-=1;haptic();
 let d=clickDmg(),crit=false;
 if(Math.random()*100<critChance()){d*=critMult();crit=true;}
 S.hp-=d;
 floatNum(e,(crit?'КРИТ ':'')+fmt(d),crit?'crit':'norm');
 if(S.hp<=0)kill();
 renderBattle();saveSoon();
}

let chestNext=Date.now()+45000+Math.random()*45000,chest=null;
function tickChest(){
 if(chest){if(Date.now()>chest.until){chest=null;renderChest();}return;}
 if(Date.now()<chestNext||curTab!=='battle')return;
 chest={x:8+Math.random()*74,y:15+Math.random()*45,until:Date.now()+12000};
 chestNext=Date.now()+45000+Math.random()*45000;
 renderChest();
}
function openChest(){
 if(!chest)return;const r=Math.random();let msg;
 if(r<0.5){const g=Math.floor((50+S.stage*10)*goldMult());S.gold=Math.min(1e18,S.gold+g);msg='+'+fmt(g)+' 🪙';}
 else if(r<0.8){const c=1+Math.floor(Math.random()*3+S.stage/20);S.crystals=Math.min(1e12,S.crystals+c);msg='+'+c+' 💎';}
 else{const it=genItem(true);addItem(it);msg='Предмет: '+it.name;renderInv();}
 toast('🎁 Сундук: '+msg);chest=null;renderChest();haptic();saveSoon();
}

function todayStr(off){const d=new Date(Date.now()-(off||0));return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
let giftReady=false;
function checkDaily(){if(S.daily.last!==todayStr())giftReady=true;}
function claimGift(){
 if(!giftReady)return;giftReady=false;
 S.daily.streak=(S.daily.last===todayStr(86400000))?S.daily.streak+1:1;
 S.daily.last=todayStr();
 const c=2+S.daily.streak*2,g=Math.floor(100*S.stage*goldMult());
 S.crystals=Math.min(1e12,S.crystals+c);S.gold=Math.min(1e18,S.gold+g);
 toast('🎁 Подарок: +'+c+' 💎, +'+fmt(g)+' 🪙 · серия '+S.daily.streak+' дн.');
 renderBattle();renderTop();saveSoon();
}

let prestArm=0;
function tapPrestige(){
 const c=crystalsFor();if(c<1)return;
 const now=Date.now();
 if(now-prestArm>3000){prestArm=now;$('prestBtn').textContent='🌀 Точно? Нажмите ещё раз';setTimeout(()=>{if(Date.now()-prestArm>=2950)renderPrest();},3100);return;}
 prestArm=0;
 S.crystals=Math.min(1e12,S.crystals+c);
 S.rec.unshift({s:S.best,t:Date.now()});S.rec.sort((a,b)=>b.s-a.s);S.rec=S.rec.slice(0,10);
 S.stage=1;S.gold=0;S.kills=0;S.energy=energyMax();
 for(const u of UPG)S.upg[u[0]]=0;
 S.hp=-1;newEnemy();
 toast('🌀 Перерождение! +'+c+' 💎 навсегда (+5% урона и золота за кристалл)');
 renderAll();saveSoon();maybeSubmit(true);
}

// ---- Leaderboard (Supabase REST) ----
function lbHeaders(){return{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'};}
async function maybeSubmit(force){
 if(!SUPABASE_URL||!SUPABASE_KEY)return;
 const now=Date.now();
 if(!force){if(now-S.lastSubTime<30000||S.stage<=S.lastSubStage)return;}
 S.lastSubTime=now;S.lastSubStage=S.stage;
 const name=(S.name||'Игрок').slice(0,16);
 try{await fetch(SUPABASE_URL+'/rest/v1/leaderboard',{method:'POST',headers:lbHeaders(),body:JSON.stringify({name:name,stage:S.stage,crystals:S.crystals})});}catch(e){}
}
async function loadLb(){
 const box=$('lbList');
 if(!SUPABASE_URL||!SUPABASE_KEY){box.innerHTML='<div class="muted">Рейтинг выключен: не заданы ключи Supabase.</div>';return;}
 box.innerHTML='<div class="muted">Загрузка…</div>';
 try{
  const r=await fetch(SUPABASE_URL+'/rest/v1/leaderboard?select=name,stage,crystals&order=stage.desc,crystals.desc&limit=10',{headers:lbHeaders()});
  const rows=await r.json();
  if(!Array.isArray(rows))throw new Error('bad response');
  if(!rows.length){box.innerHTML='<div class="muted">Пока пусто — станьте первым!</div>';return;}
  const medal=['🥇','🥈','🥉'];
  box.innerHTML=rows.map((x,i)=>{
   const me=x.name===(S.name||'Игрок');
   return '<div class="lbr'+(me?' me':'')+'"><div class="med">'+(medal[i]||(i+1))+'</div><div class="n">'+String(x.name).slice(0,16)+'</div><div>эп. '+Math.floor(cl(x.stage,0))+' · 💎'+Math.floor(cl(x.crystals,0))+'</div></div>';
  }).join('');
 }catch(e){box.innerHTML='<div class="muted">Рейтинг недоступен. Проверьте таблицу и ключи Supabase.</div>';}
}

// ---- Render ----
let curTab='battle';
function setTab(t){
 curTab=t;
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
 document.querySelectorAll('.tab').forEach(s=>s.classList.add('hidden'));
 $('tab-'+t).classList.remove('hidden');
 if(t==='lb')loadLb();
 if(t==='rec')renderRec();
 if(t==='inv')renderInv();
 if(t==='upg')renderUpg();
 renderBattle();
}
function renderTop(){
 $('hGold').textContent=fmt(S.gold);$('hCr').textContent=fmt(S.crystals);
 const zi=Math.floor((S.stage-1)/10)%6;
 $('hZone').textContent=ZONES[zi][0]+' '+ZONES[zi][1];
 const em=energyMax();
 $('ebarFill').style.width=Math.max(0,Math.min(100,S.energy/em*100))+'%';
}
function renderChest(){
 const el=$('chest');
 if(chest){el.classList.remove('hidden');el.style.left=chest.x+'%';el.style.top=chest.y+'%';}
 else el.classList.add('hidden');
}
function renderBattle(){
 renderTop();
 $('stageLbl').textContent='Этап '+S.stage+(isBoss()?' · босс!':'');
 $('bossBadge').classList.toggle('hidden',!isBoss());
 const zi=Math.floor((S.stage-1)/10)%6;
 $('enemy').textContent=isBoss()?'☠️':EMO[zi][S.stage%5];
 const m=enemyHpMax();
 $('hpFill').style.width=Math.max(0,Math.min(100,(S.hp||0)/m*100))+'%';
 $('hpLbl').textContent=fmt(Math.max(0,Math.ceil(S.hp||0)))+' / '+fmt(m);
 renderPrest();
 $('giftBtn').classList.toggle('hidden',!giftReady);
 if(giftReady)$('giftBtn').textContent='🎁 Забрать подарок (серия '+Math.max(1,S.daily.streak)+')';
}
function renderPrest(){
 const c=crystalsFor(),b=$('prestBtn');
 b.disabled=c<1;
 b.textContent=c<1?'🌀 Перерождение (нужен этап 20+)':'🌀 Перерождение: +'+c+' 💎';
}
function renderUpg(){
 $('upgList').innerHTML=UPG.map((u,i)=>{
  const lvl=S.upg[u[0]],cost=upgCost(i),can=S.gold>=cost;
  return '<div class="upg"><div class="ic">'+u[1]+'</div><div class="info"><div class="nm">'+u[2]+' <span class="lv">ур. '+lvl+'</span></div><div class="eff">'+u[5]+'</div></div><button class="buy" data-i="'+i+'" '+(can?'':'disabled')+'>🪙 '+fmt(cost)+'</button></div>';
 }).join('');
 document.querySelectorAll('#upgList .buy').forEach(b=>b.addEventListener('click',()=>buyUpg(+b.dataset.i)));
}
function buyUpg(i){
 const cost=upgCost(i);if(S.gold<cost)return;
 S.gold-=cost;S.upg[UPG[i][0]]++;haptic();
 if(UPG[i][0]==='batt')S.energy=Math.min(S.energy,energyMax());
 renderUpg();renderTop();saveSoon();
}
function renderInv(){
 $('slotGrid').innerHTML=SLOTS.map(s=>{
  const p=itemBonus(s[0]);
  return '<div class="slot"><div class="t">'+s[1]+' '+s[2]+' <span style="color:#9aa4b2">('+s[3]+')</span></div><div class="v">'+(p?'+'+p+'% · '+S.inv.filter(x=>x.slot===s[0]).sort((a,b)=>b.p-a.p)[0].name:'— пусто')+'</div></div>';
 }).join('');
 const sorted=S.inv.slice().sort((a,b)=>b.p-a.p);
 const best={};for(const x of S.inv)if(!best[x.slot]||x.p>best[x.slot].p)best[x.slot]=x;
 $('invList').innerHTML=sorted.length?sorted.map((it,i)=>{
  const isBest=best[it.slot]===it;
  return '<div class="inv"><span>'+SLOTS.find(s=>s[0]===it.slot)[1]+'</span><div class="nm" style="color:'+RAR[it.rar][1]+'">'+it.name+' (+'+it.p+'%)</div>'+(isBest?'<span class="eq">надето</span>':'<button class="sell" data-i="'+i+'">Продать 🪙'+Math.floor(it.p*20)+'</button>')+'</div>';
 }).join(''):'<div class="muted">Пока ничего не выпало. Боссы роняют предметы всегда!</div>';
 document.querySelectorAll('#invList .sell').forEach(b=>b.addEventListener('click',()=>{
  const it=sorted[+b.dataset.i];const idx=S.inv.indexOf(it);
  if(idx>=0){S.gold=Math.min(1e18,S.gold+Math.floor(it.p*20));S.inv.splice(idx,1);renderInv();renderTop();saveSoon();}
 }));
}
function renderRec(){
 $('recList').innerHTML=S.rec.length?S.rec.map((r,i)=>{
  const medal=['🥇','🥈','🥉'];
  return '<div class="rec"><div class="med">'+(medal[i]||(i+1))+'</div><div style="flex:1">Этап '+r.s+'</div><div style="color:#8890b8;font-size:12px">'+new Date(r.t).toLocaleDateString()+'</div></div>';
 }).join(''):'<div class="muted">Сделайте перерождение — и первый рекорд появится здесь.</div>';
}
function renderAll(){renderBattle();renderUpg();renderInv();renderRec();}

// ---- init ----
(function init(){
 if(S.name)$('lbName').value=S.name;
 const em=energyMax();
 if(S.hp<=0||S.hp>em*1e9||S.hp>enemyHpMax()*1.001)newEnemy();
 if(S.energy>em)S.energy=em;
 if(S.lastSeen){
  const dt=Math.min((Date.now()-S.lastSeen)/1000,8*3600);
  const g=Math.floor(compDps()*dt*2);
  if(g>0){S.gold=Math.min(1e18,S.gold+g);setTimeout(()=>toast('💤 Пока вас не было: +'+fmt(g)+' 🪙'),800);}
 }
 checkDaily();
 newEnemyFlag=false;
 renderAll();
})();

$('enemy').addEventListener('pointerdown',tap);
$('chest').addEventListener('pointerdown',openChest);
$('giftBtn').addEventListener('click',claimGift);
$('prestBtn').addEventListener('click',tapPrestige);
$('lbSend').addEventListener('click',()=>{maybeSubmit(true).then(()=>{toast('📤 Результат отправлен');loadLb();});});
$('lbRef').addEventListener('click',loadLb);
$('lbName').addEventListener('input',e=>{S.name=e.target.value.slice(0,16);saveSoon();});
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));

setInterval(()=>{
 S.energy=Math.min(energyMax(),S.energy+(1+S.upg.batt*0.2)*0.25);
 if(S.hp>0&&compDps()>0){S.hp-=compDps()*0.25;if(S.hp<=0)kill();}
 tickChest();renderBattle();
},250);
setInterval(save,5000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
window.addEventListener('pagehide',save);
</script>
</body>
</html>
